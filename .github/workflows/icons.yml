# Fabrique les icônes de l'application (assets/*.png) à partir de l'image déposée dans logo/,
# les enregistre dans le dépôt, puis relance la publication GitHub Pages.
name: Icônes de l'application

on:
  push:
    branches: [main]
    paths: ['logo/**', '!logo/README.md']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: icons
  cancel-in-progress: true

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les outils
        run: npm ci

      - name: Fabriquer les icônes
        run: node tools/make-icons.mjs

      - name: Enregistrer les icônes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Icônes déjà à jour."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Icônes de l'application régénérées depuis logo/"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Une modification enregistrée par une action ne relance pas toujours GitHub Pages.
      - name: Relancer la publication GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
